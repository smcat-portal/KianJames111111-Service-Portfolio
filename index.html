<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KianJames111111 | Service Portfolio</title>
    <meta name="description" content="KianJames111111 personal portfolio and service record." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg: #e7f8dc;
        --bg2: #d5f0ca;
        --card: #fbfff9;
        --card2: #edf9e8;
        --green: #123f29;
        --green-hover: #1b5e3c;
        --accent: #2e8b57;
        --text: #1a2e22;
        --text-muted: #4a6b57;
        --border: #bce6a9;
      }

      .dark {
        --bg: #0d1a12;
        --bg2: #13261a;
        --card: #183323;
        --card2: #1e402c;
        --green: #a3e6be;
        --green-hover: #c6f6d5;
        --accent: #48bb78;
        --text: #e2f8ec;
        --text-muted: #94b8a3;
        --border: #264d36;
      }

      * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'DM Sans', sans-serif; }
      body { background-color: var(--bg); color: var(--text); min-height: 100vh; transition: background 0.3s, color 0.3s; }
      
      header {
        display: flex; justify-content: space-between; align-items: center;
        padding: 20px 40px; background: var(--card); border-bottom: 1px solid var(--border);
        position: sticky; top: 0; z-index: 100;
      }

      .logo { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 1.2rem; color: var(--green); }
      .nav-btns { display: flex; gap: 10px; align-items: center; }
      button { background: var(--green); color: var(--card); border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 600; transition: 0.2s; }
      button:hover { background: var(--green-hover); }
      .icon-btn { background: var(--card2); color: var(--text); padding: 8px 12px; font-size: 1rem; border: 1px solid var(--border); }

      .container { max-width: 1000px; margin: 40px auto; padding: 0 20px; }
      .hero { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 40px; margin-bottom: 30px; box-shadow: 0 4px 20px rgba(0,0,0,0.03); }
      .hero h1 { font-family: 'Space Grotesk', sans-serif; font-size: 2.2rem; color: var(--green); margin-bottom: 10px; }
      .hero p { color: var(--text-muted); font-size: 1.1rem; margin-bottom: 15px; }
      .hero-details { display: flex; gap: 20px; font-size: 0.95rem; color: var(--text); margin-bottom: 20px; flex-wrap: wrap; }
      .quote-box { background: var(--card2); padding: 15px 20px; border-left: 4px solid var(--accent); border-radius: 0 8px 8px 0; font-style: italic; color: var(--text); }

      section { margin-bottom: 40px; }
      section h2 { font-family: 'Space Grotesk', sans-serif; font-size: 1.5rem; color: var(--green); margin-bottom: 20px; border-bottom: 2px solid var(--border); padding-bottom: 8px; }
      
      .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
      .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 25px; transition: transform 0.2s; cursor: pointer; }
      .card:hover { transform: translateY(-3px); }
      .card h3 { font-family: 'Space Grotesk', sans-serif; font-size: 1.2rem; color: var(--green); margin-bottom: 8px; display: flex; justify-content: space-between; }
      .card p { color: var(--text-muted); font-size: 0.95rem; line-height: 1.5; }
      .card small { display: block; font-weight: 600; color: var(--accent); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
      .tags { margin-top: 12px; font-size: 0.85rem; background: var(--card2); display: inline-block; padding: 4px 10px; border-radius: 4px; color: var(--text); }

      /* Modal System */
      .modal-backdrop { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: none; z-index: 1000; justify-content: center; align-items: center; padding: 20px; }
      .modal-backdrop.open { display: flex; }
      .modal { background: var(--card); width: 100%; max-width: 600px; border-radius: 16px; border: 1px solid var(--border); padding: 30px; position: relative; max-height: 90vh; overflow-y: auto; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
      .close-modal { position: absolute; top: 20px; right: 20px; background: none; border: none; font-size: 1.5rem; color: var(--text); cursor: pointer; }
      .modal-tag { display: inline-block; background: var(--card2); color: var(--accent); font-size: 0.8rem; font-weight: 700; padding: 4px 10px; border-radius: 4px; margin-bottom: 10px; }
      .modal h2 { font-family: 'Space Grotesk', sans-serif; font-size: 1.6rem; color: var(--green); margin-bottom: 10px; }
      .modal p { color: var(--text-muted); margin-bottom: 20px; line-height: 1.6; }
      .modal-extra { background: var(--bg2); padding: 15px; border-radius: 8px; font-size: 0.9rem; margin-top: 15px; }

      /* Admin Forms */
      .admin-form label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 0.9rem; color: var(--text); margin-top: 12px; }
      .admin-form input, .admin-form textarea { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--text); font-size: 0.95rem; }
      .admin-form button { margin-top: 15px; width: 100%; }
      .del-btn { background: #d9534f; color: white; padding: 4px 10px; font-size: 0.8rem; border-radius: 4px; border: none; cursor: pointer; }
      .del-btn:hover { background: #c9302c; }
      .admin-tab { background: var(--card2); color: var(--text); border: 1px solid var(--border); }
      .admin-tab.active { background: var(--green); color: var(--card); border-color: var(--green); }
    </style>
  </head>
  <body>

    <header>
      <div class="logo">KIANJAMES111111</div>
      <div class="nav-btns">
        <button id="theme" class="icon-btn" title="Toggle Theme">☾</button>
        <button id="adminBtn">Admin Panel</button>
      </div>
    </header>

    <div class="container">
      <!-- Hero Profile Section -->
      <div class="hero">
        <h1 id="profileName">KIAN JAMES</h1>
        <p id="profileTitle">Service Portfolio & Developer</p>
        <div class="hero-details">
          <span>📍 Country: <strong id="profileCountry">Philippines</strong></span>
          <span>🎂 Age: <strong id="profileAge">16</strong></span>
        </div>
        <div class="quote-box" id="profileQuote">
          “Striving for excellence in service, scouting, and digital development.”
        </div>
      </div>

      <!-- Skills Section -->
      <section>
        <h2>Core Skills</h2>
        <div class="grid" id="skillGrid"></div>
      </section>

      <!-- Projects Section -->
      <section>
        <h2>Projects</h2>
        <div class="grid" id="projectGrid"></div>
      </section>

      <!-- Experience Section -->
      <section>
        <h2>Experience & Service</h2>
        <div class="grid" id="expGrid"></div>
      </section>

      <!-- Awards Section -->
      <section>
        <h2>Awards & Milestones</h2>
        <div class="grid" id="awardGrid"></div>
      </section>
    </div>

    <!-- Universal Modal -->
    <div class="modal-backdrop" id="backdrop">
      <div class="modal" id="modal">
        <button class="close-modal" id="close">&times;</button>
        <span class="modal-tag" id="mTag">TAG</span>
        <h2 id="mTitle">Title</h2>
        <p id="mText">Description content goes here...</p>
        <div class="modal-extra" id="mExtra"></div>
      </div>
    </div>

    <script>
      const STORAGE_KEY = "kian_portfolio_data_v1";

      const defaultProfileData = {
        name: "KIAN JAMES",
        title: "Service Portfolio & Developer",
        country: "Philippines",
        age: "16",
        quote: "Striving for excellence in service, scouting, and digital development."
      };

      const defaultSkills = [
        ["Web Development", "HTML, CSS, JavaScript dynamic UI", 85, "★"],
        ["Discord Bot Dev", "Python & discord.py automation", 90, "★"]
      ];

      const defaultProjects = [
        ["Web Development", "Service Portfolio", "Interactive personal showcase website.", "HTML / CSS / JS"]
      ];

      const defaultExperience = [
        ["2024 - PRESENT", "Discord Bot Manager", "Maintains automated admissions and database management bots."]
      ];

      const defaultAwards = [
        ["🏅", "Scouting Achievement", "Boy Scouts of the Philippines"]
      ];

      let profileData = { ...defaultProfileData };
      let skills = [...defaultSkills];
      let projects = [...defaultProjects];
      let experience = [...defaultExperience];
      let awards = [...defaultAwards];

      const ADMIN_PASSWORD = "admin";

      function loadSavedData() {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          if (saved) {
            const parsed = JSON.parse(saved);
            if (parsed.profileData) profileData = parsed.profileData;
            if (parsed.skills) skills = parsed.skills;
            if (parsed.projects) projects = parsed.projects;
            if (parsed.experience) experience = parsed.experience;
            if (parsed.awards) awards = parsed.awards;
          }
        } catch (err) {
          console.error("Error loading saved data:", err);
        }
      }

      async function persistData() {
        try {
          const dataToSave = { profileData, skills, projects, experience, awards };
          localStorage.setItem(STORAGE_KEY, JSON.stringify(dataToSave));
        } catch (err) {
          console.error("Error persisting data:", err);
        }
      }

      function renderAll() {
        const nameEl = document.getElementById("profileName");
        const titleEl = document.getElementById("profileTitle");
        const countryEl = document.getElementById("profileCountry");
        const ageEl = document.getElementById("profileAge");
        const quoteEl = document.getElementById("profileQuote");

        if (nameEl) nameEl.textContent = profileData.name;
        if (titleEl) titleEl.textContent = profileData.title;
        if (countryEl) countryEl.textContent = profileData.country;
        if (ageEl) ageEl.textContent = profileData.age;
        if (quoteEl) quoteEl.textContent = `“${profileData.quote}”`;

        const skillGrid = document.getElementById("skillGrid");
        if (skillGrid) {
          skillGrid.innerHTML = "";
          skills.forEach((s) => {
            const e = document.createElement("div");
            e.className = "card";
            e.innerHTML = `
              <h3>${s[0]} <span>${s[2]}%</span></h3>
              <p>${s[1]}</p>
            `;
            skillGrid.appendChild(e);
          });
        }

        const projectGrid = document.getElementById("projectGrid");
        if (projectGrid) {
          projectGrid.innerHTML = "";
          projects.forEach((p) => {
            const e = document.createElement("div");
            e.className = "card";
            e.innerHTML = `
              <small>${p[0]}</small>
              <h3>${p[1]}</h3>
              <p>${p[2]}</p>
              <div class="tags">${p[3]}</div>
            `;
            projectGrid.appendChild(e);
          });
        }

        const expGrid = document.getElementById("expGrid");
        if (expGrid) {
          expGrid.innerHTML = "";
          experience.forEach((x) => {
            const e = document.createElement("div");
            e.className = "card";
            e.innerHTML = `
              <small>${x[0]}</small>
              <h3>${x[1]}</h3>
              <p>${x[2]}</p>
            `;
            expGrid.appendChild(e);
          });
        }

        const awardGrid = document.getElementById("awardGrid");
        if (awardGrid) {
          awardGrid.innerHTML = "";
          awards.forEach((a) => {
            const e = document.createElement("div");
            e.className = "card";
            e.innerHTML = `
              <div style="font-size: 2rem; margin-bottom: 8px;">${a[0]}</div>
              <h3>${a[1]}</h3>
              <p>${a[2]}</p>
            `;
            e.onclick = () => openModal("AWARD & MILESTONE", a[1], `Recognition received through ${a[2]}.`, "<b>Category</b><br>Service, academy or achievement recognition");
            awardGrid.appendChild(e);
          });
        }
      }

      function openModal(tag, title, text, extra) {
        document.getElementById("mTag").textContent = tag;
        document.getElementById("mTitle").textContent = title;
        document.getElementById("mText").textContent = text;
        document.getElementById("mExtra").innerHTML = extra;
        document.getElementById("modal").classList.add("open");
        document.body.style.overflow = "hidden";
      }

      function closeModal() {
        document.getElementById("modal").classList.remove("open");
        document.body.style.overflow = "";
      }

      document.getElementById("close").onclick = closeModal;
      document.getElementById("backdrop").onclick = closeModal;
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") closeModal();
      });

      document.getElementById("theme").onclick = () => {
        document.body.classList.toggle("dark");
        document.getElementById("theme").textContent = document.body.classList.contains("dark") ? "☀" : "☾";
        localStorage.setItem("kian-theme", document.body.classList.contains("dark") ? "dark" : "light");
      };

      if (localStorage.getItem("kian-theme") === "dark") {
        document.body.classList.add("dark");
        document.getElementById("theme").textContent = "☀";
      }

      document.getElementById("adminBtn").onclick = () => {
        const pass = prompt("Enter Admin Password:");
        if (pass === ADMIN_PASSWORD) {
          showAdminPanel("profile");
        } else if (pass !== null) {
          alert("Incorrect password! Access denied.");
        }
      };

      function showAdminPanel(tab) {
        let content = `
          <div style="display:flex; gap:8px; margin-bottom:15px; flex-wrap:wrap;">
            <button class="admin-tab ${tab === "profile" ? "active" : ""}" onclick="showAdminPanel('profile')">Profile</button>
            <button class="admin-tab ${tab === "skills" ? "active" : ""}" onclick="showAdminPanel('skills')">Skills</button>
            <button class="admin-tab ${tab === "projects" ? "active" : ""}" onclick="showAdminPanel('projects')">Projects</button>
            <button class="admin-tab ${tab === "experience" ? "active" : ""}" onclick="showAdminPanel('experience')">Experience</button>
            <button class="admin-tab ${tab === "awards" ? "active" : ""}" onclick="showAdminPanel('awards')">Awards</button>
          </div>
        `;

        if (tab === "profile") {
          content += `
            <form class="admin-form" onsubmit="saveProfile(event)">
              <label>Name / Display Title</label>
              <input type="text" id="admName" value="${profileData.name}" required>
              <label>Sub-Headline / Role</label>
              <input type="text" id="admTitle" value="${profileData.title}" required>
              <label>Country</label>
              <input type="text" id="admCountry" value="${profileData.country}" required>
              <label>Age</label>
              <input type="text" id="admAge" value="${profileData.age}" required>
              <label>Quote</label>
              <textarea id="admQuote" rows="2" required>${profileData.quote}</textarea>
              <button type="submit">Save Profile Changes</button>
            </form>
          `;
        } else if (tab === "skills") {
          content += `<div>`;
          skills.forEach((s, i) => {
            content += `<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; background:var(--bg2); padding:8px; border-radius:6px;"><span><b>${s[0]}</b> (${s[2]}%)</span><button class="del-btn" onclick="deleteItem('skills',${i})">Delete</button></div>`;
          });
          content += `</div><form class="admin-form" onsubmit="addSkill(event)">
            <h4>Add New Skill</h4>
            <input type="text" id="sTitle" placeholder="Skill Name" required>
            <input type="text" id="sDesc" placeholder="Description" required>
            <input type="number" id="sProf" placeholder="Proficiency % (e.g. 90)" required>
            <button type="submit">Add Skill</button>
          </form>`;
        } else if (tab === "projects") {
          content += `<div>`;
          projects.forEach((p, i) => {
            content += `<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; background:var(--bg2); padding:8px; border-radius:6px;"><span><b>${p[1]}</b></span><button class="del-btn" onclick="deleteItem('projects',${i})">Delete</button></div>`;
          });
          content += `</div><form class="admin-form" onsubmit="addProject(event)">
            <h4>Add New Project</h4>
            <input type="text" id="pCategory" placeholder="Category" required>
            <input type="text" id="pTitle" placeholder="Project Title" required>
            <input type="text" id="pDesc" placeholder="Description" required>
            <input type="text" id="pTags" placeholder="Tags / Details" required>
            <button type="submit">Add Project</button>
          </form>`;
        } else if (tab === "experience") {
          content += `<div>`;
          experience.forEach((x, i) => {
            content += `<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; background:var(--bg2); padding:8px; border-radius:6px;"><span><b>${x[1]}</b></span><button class="del-btn" onclick="deleteItem('experience',${i})">Delete</button></div>`;
          });
          content += `</div><form class="admin-form" onsubmit="addExperience(event)">
            <h4>Add New Experience</h4>
            <input type="text" id="xDate" placeholder="Date / Period" required>
            <input type="text" id="xTitle" placeholder="Organization / Title" required>
            <textarea id="xDesc" placeholder="Role Description" rows="2" required></textarea>
            <button type="submit">Add Experience</button>
          </form>`;
        } else if (tab === "awards") {
          content += `<div>`;
          awards.forEach((a, i) => {
            content += `<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; background:var(--bg2); padding:8px; border-radius:6px;"><span>${a[0]} <b>${a[1]}</b></span><button class="del-btn" onclick="deleteItem('awards',${i})">Delete</button></div>`;
          });
          content += `</div><form class="admin-form" onsubmit="addAward(event)">
            <h4>Add New Award</h4>
            <input type="text" id="aIcon" placeholder="Icon / Emoji (e.g. 🏅)" required>
            <input type="text" id="aTitle" placeholder="Award Name" required>
            <input type="text" id="aOrg" placeholder="Organization / Issuer" required>
            <button type="submit">Add Award</button>
          </form>`;
        }

        openModal("ADMIN PANEL", "Content Manager", "Manage website content live.", content);
      }

      async function saveProfile(e) {
        e.preventDefault();
        profileData.name = document.getElementById("admName").value;
        profileData.title = document.getElementById("admTitle").value;
        profileData.country = document.getElementById("admCountry").value;
        profileData.age = document.getElementById("admAge").value;
        profileData.quote = document.getElementById("admQuote").value;
        await persistData();
        renderAll();
        alert("Profile updated successfully!");
        closeModal();
      }

      async function deleteItem(type, idx) {
        if (confirm("Are you sure you want to delete this item?")) {
          if (type === "skills") skills.splice(idx, 1);
          if (type === "projects") projects.splice(idx, 1);
          if (type === "experience") experience.splice(idx, 1);
          if (type === "awards") awards.splice(idx, 1);
          await persistData();
          renderAll();
          showAdminPanel(type);
        }
      }

      async function addSkill(e) {
        e.preventDefault();
        skills.push([document.getElementById("sTitle").value, document.getElementById("sDesc").value, parseInt(document.getElementById("sProf").value), "★"]);
        await persistData();
        renderAll();
        showAdminPanel("skills");
      }

      async function addProject(e) {
        e.preventDefault();
        projects.push([document.getElementById("pCategory").value, document.getElementById("pTitle").value, document.getElementById("pDesc").value, document.getElementById("pTags").value]);
        await persistData();
        renderAll();
        showAdminPanel("projects");
      }

      async function addExperience(e) {
        e.preventDefault();
        experience.push([document.getElementById("xDate").value, document.getElementById("xTitle").value, document.getElementById("xDesc").value]);
        await persistData();
        renderAll();
        showAdminPanel("experience");
      }

      async function addAward(e) {
        e.preventDefault();
        awards.push([document.getElementById("aIcon").value, document.getElementById("aTitle").value, document.getElementById("aOrg").value]);
        await persistData();
        renderAll();
        showAdminPanel("awards");
      }

      loadSavedData();
      renderAll();
    </script>
  </body>
</html>
